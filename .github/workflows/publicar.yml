# Publica o pacote no npm e a ficha no registro oficial do MCP.
# Dispara pelo botão "Run workflow" em Actions > Publicar, ou por uma tag de versão (ex.: v0.1.0).
# Segredos necessários em Settings > Secrets and variables > Actions:
#   NPM_TOKEN        token de publicação do npm (organização altiusanalytics)
#   MCP_PRIVATE_KEY  chave privada Ed25519 (hex) ligada ao TXT do domínio altiusanalytics.com.br
name: Publicar

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Preparar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Instalar dependências
        run: npm ci

      - name: Conferir versões
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          SRVPKG="$(node -p "require('./server.json').packages[0].version")"
          echo "package.json=$PKG server.json=$SRV pacote=$SRVPKG"
          test "$PKG" = "$SRV" && test "$PKG" = "$SRVPKG"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "${GITHUB_REF_NAME#v}" = "$PKG"; fi

      - name: Publicar no npm (se a versão ainda não existir)
        run: |
          set -euo pipefail
          NOME="$(node -p "require('./package.json').name")"
          VERSAO="$(node -p "require('./package.json').version")"
          if npm view "$NOME@$VERSAO" version >/dev/null 2>&1; then
            echo "$NOME@$VERSAO já está no npm. Pulando."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Instalar o cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Baixar e verificar o mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Entrar no registro do MCP (domínio)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "${MCP_PRIVATE_KEY}" ]; then
            echo "::error::O segredo MCP_PRIVATE_KEY não existe ou está vazio. Crie em Settings > Secrets and variables > Actions."
            exit 1
          fi
          CHAVE="$(printf '%s' "${MCP_PRIVATE_KEY}" | tr -d '[:space:]')"
          echo "Tamanho da chave: ${#CHAVE} caracteres (o esperado é 64)."
          ./mcp-publisher login dns --domain altiusanalytics.com.br --private-key "${CHAVE}"

      - name: Publicar no registro do MCP
        run: ./mcp-publisher publish
